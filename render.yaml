services:
  - type: web
    name: exam-generator-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 18
      - key: PYTHON_SERVICE_URL
        value: http://exam-generator-python:5001
      - key: USE_FIRESTORE
        value: "true"

  - type: web
    name: exam-generator-python
    env: python
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
