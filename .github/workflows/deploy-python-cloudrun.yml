name: Deploy Python Service to Cloud Run

on:
  push:
    branches: [ "main" ]
    paths:
      - 'python-service/**'
      - '.github/workflows/deploy-python-cloudrun.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GAR_REPO }}
  SERVICE: ${{ secrets.CLOUD_RUN_PY_SERVICE }}
  IMAGE_NAME: exam-generator-python

jobs:
  deploy:
    name: Build and Deploy Python Service
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    concurrency:
      group: deploy-python-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CRITICAL FIX: Added project_id to prevent "Quota Project" errors
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build container
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          # Build using the python-service folder as context
          docker build -t $IMAGE_URI -f python-service/Dockerfile python-service

      - name: Push container
        run: docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        run: |
          SERVICE_NAME=${{ env.SERVICE }}
          if [ -z "$SERVICE_NAME" ]; then SERVICE_NAME=exam-generator-python; fi
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_URI \
            --region ${{ env.REGION }} \
            --allow-unauthenticated